[lib]
crate-type = ["cdylib", "rlib"]

[package]
name = "neural_net"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = "1.25.2"
byteorder = "1.5.0"
console_error_panic_hook = "0.1.7"
env_logger = "0.11.11"
flate2 = "1.1.9"
rand = "0.10.2"
tokio = { version = "1.53.1", features = ["sync", "macros", "rt"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
wasm-bindgen-test = "0.3.76"
web-sys = {version = "0.3.104", features = ["console"]}
wgpu = {version = "30.0.0", features = ["webgpu"]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
