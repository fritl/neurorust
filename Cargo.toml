[package]
name = "neural_net"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1.5.0"
flate2 = "1.1.9"
rand = "0.10.2"
wasm-bindgen = "0.2.126"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.103", features = ["console"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
